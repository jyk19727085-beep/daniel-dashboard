<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DANIEL MASTER TERMINAL V16.7</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #020202; color: #e2e8f0; font-family: sans-serif; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
    iframe { border: none; width: 100%; height: 100%; background: #050505; }
    .widget-card { background: #0a0a0a; border: 1px solid #1e293b; border-radius: 14px; overflow: hidden; }
  </style>
</head>
<body class="p-2 md:p-6">
  <div class="max-w-[1200px] mx-auto space-y-4">
    <!-- 상단 커맨드 바 -->
    <header class="flex flex-col gap-4 border-b border-slate-800 pb-5">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 p-2 rounded-xl shadow-lg"><i data-lucide="globe" class="text-white"></i></div>
        <h1 class="text-xl font-black text-white uppercase tracking-tighter">Daniel Terminal <span class="text-indigo-400">V16.7</span></h1>
      </div>
      <!-- 강제 새로고침 버튼 (핵심) -->
      <button id="forceUpdate" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-5 rounded-2xl font-black shadow-2xl active:scale-95 flex items-center justify-center gap-2 transition-all text-lg">
        <i data-lucide="refresh-cw" id="spinIcon"></i> 실시간 데이터 강제 동기화 (C-Bust)
      </button>
    </header>

    <!-- 한국 시장(KRX) 히트맵 -->
    <div class="h-[580px] widget-card">
      <div class="p-3 border-b border-slate-800 bg-[#0d0d0d] flex justify-between items-center">
        <span class="text-xs font-bold text-emerald-400 flex items-center gap-1"><i data-lucide="layout-grid" class="w-3 h-3"></i> 국내 증시 수급 (KRX DIRECT)</span>
      </div>
      <iframe id="krxMap" src="https://s.tradingview.com/embed-widget/stock-heatmap/?locale=kr&dataSource=KRX&colorTheme=dark&hasSymbolLogo=true&grouping=sector&market=all&symbolBy=market_cap&size=market_cap&color=change"></iframe>
    </div>

    <!-- 나스닥 지표 & 뉴스 -->
    <div class="grid grid-cols-1 gap-4">
      <div class="h-[400px] widget-card">
        <iframe class="sub-widget" src="https://s.tradingview.com/embed-widget/technical-analysis/?locale=kr&colorTheme=dark&symbol=NASDAQ%3AIXIC&interval=1h&isTransparent=true"></iframe>
      </div>
      <div class="h-[480px] widget-card">
        <iframe class="sub-widget" src="https://s.tradingview.com/embed-widget/timeline/?locale=kr&colorTheme=dark&isTransparent=true&displayMode=regular"></iframe>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
    const btn = document.getElementById('forceUpdate');
    const icon = document.getElementById('spinIcon');
    
    btn.addEventListener('click', () => {
      icon.classList.add('animate-spin');
      
      // 모든 프레임의 주소 뒤에 고유 번호(?v=시간)를 붙여 캐시를 파괴합니다.
      document.querySelectorAll('iframe').forEach(f => {
        const baseUrl = f.src.split('?')[0];
        const params = new URLSearchParams(f.src.split('?')[1]);
        params.set('cache_bust', Date.now()); // 매 클릭시 다른 숫자 발생
        f.src = baseUrl + '?' + params.toString();
      });
      
      setTimeout(() => icon.classList.remove('animate-spin'), 1200);
    });
  </script>
</body>
</html>
