<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DANIEL COMMAND CENTER V16.5</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #020202; color: #e2e8f0; font-family: sans-serif; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
    iframe { border: none; width: 100%; height: 100%; transition: opacity 0.3s; }
    .widget-box { background: #0a0a0a; border: 1px solid #1e293b; border-radius: 12px; overflow: hidden; height: 100%; }
  </style>
</head>
<body class="p-2 md:p-6">
  <div class="max-w-[1200px] mx-auto space-y-4">
    <!-- 헤더 -->
    <header class="flex flex-col gap-4 border-b border-slate-800 pb-5">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 p-2 rounded-xl shadow-lg shadow-indigo-500/30"><i data-lucide="globe" class="text-white"></i></div>
        <h1 class="text-xl font-black text-white uppercase tracking-tighter">Daniel Terminal <span class="text-indigo-400">V16.5</span></h1>
      </div>
      <button id="updateBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-4 rounded-xl font-black shadow-xl active:scale-[0.98] flex items-center justify-center gap-2 transition-all">
        <i data-lucide="refresh-cw" id="updateIcon"></i> 실시간 데이터 강제 동기화
      </button>
    </header>

    <!-- KRX 한국 시장 히트맵 (모바일 가시성 고정) -->
    <div class="h-[550px] widget-box">
      <div class="p-3 border-b border-slate-800 flex justify-between items-center bg-[#0d0d0d]">
        <span class="text-xs font-bold text-emerald-400 flex items-center gap-1"><i data-lucide="layout-grid" class="w-3 h-3"></i> 실시간 국네 증시 (KRX)</span>
      </div>
      <!-- dataSource를 KRX로 강력 고정했습니다 -->
      <iframe id="krxMap" src="https://s.tradingview.com/embed-widget/stock-heatmap/?locale=kr&dataSource=KRX&colorTheme=dark&hasSymbolLogo=true&grouping=sector&market=all&symbolBy=market_cap&size=market_cap&color=change"></iframe>
    </div>

    <!-- 나스닥 분석 및 뉴스 -->
    <div class="grid grid-cols-1 gap-4">
      <div class="h-[400px] widget-box">
        <iframe src="https://s.tradingview.com/embed-widget/technical-analysis/?locale=kr&colorTheme=dark&symbol=NASDAQ%3AIXIC&interval=1h&isTransparent=true"></iframe>
      </div>
      <div class="h-[450px] widget-box">
        <iframe src="https://s.tradingview.com/embed-widget/timeline/?locale=kr&colorTheme=dark&isTransparent=true&displayMode=regular"></iframe>
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
    const btn = document.getElementById('updateBtn');
    const icon = document.getElementById('updateIcon');
    // 버튼 클릭 시 모든 프레임을 캐시 무시하고 새로 불러옵니다
    btn.addEventListener('click', () => {
      icon.classList.add('animate-spin');
      document.querySelectorAll('iframe').forEach(f => {
        const url = new URL(f.src);
        url.searchParams.set('t', Date.now()); // 주소 뒤에 시간을 붙여 매번 새 데이터 요청
        f.src = url.toString();
      });
      setTimeout(() => icon.classList.remove('animate-spin'), 1000);
    });
  </script>
</body>
</html>
