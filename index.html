<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DANIEL COMMAND CENTER</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { background-color: #020202; color: #e2e8f0; font-family: sans-serif; overflow-x: hidden; touch-action: manipulation; }
    iframe { border: none; width: 100%; height: 100%; pointer-events: auto; }
    .widget-container { background: #0a0a0a; border: 1px solid #1e293b; border-radius: 1rem; overflow: hidden; }
  </style>
</head>
<body class="p-2 md:p-6">
  <div class="max-w-[1900px] mx-auto space-y-4">
    <header class="flex flex-col gap-4 border-b border-slate-800 pb-5">
      <div class="flex items-center gap-3">
        <div class="bg-indigo-600 p-2 rounded-xl shadow-lg shadow-indigo-500/30"><i data-lucide="globe" class="w-6 h-6 text-white"></i></div>
        <h1 class="text-xl font-black text-white uppercase tracking-tighter">Daniel Command <span class="text-indigo-400">V16.5</span></h1>
      </div>
      <button id="refreshBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-4 rounded-xl font-black shadow-xl active:scale-[0.98] transition-all flex items-center justify-center gap-2">
        <i data-lucide="refresh-cw" id="refreshIcon"></i> 실시간 데이터 즉시 업데이트
      </button>
    </header>

    <div class="h-12 widget-container">
      <iframe src="https://s.tradingview.com/embed-widget/ticker-tape/?locale=kr&colorTheme=dark&isTransparent=true&symbols=%5B%7B%22proName%22%3A%22NASDAQ%3AIXIC%22%2C%22title%22%3A%22나스닥%22%7D%2C%7B%22proName%22%3A%22KRX%3AKOSPI%22%2C%22title%22%3A%22KOSPI%22%7D%2C%7B%22proName%22%3A%22FX_IDC%3AUSDKRW%22%2C%22title%22%3A%22원/달러%22%7D%5D"></iframe>
    </div>

    <div class="h-[500px] widget-container">
      <div class="p-3 border-b border-slate-800 flex justify-between items-center bg-[#0d0d0d]">
        <span class="text-xs font-bold text-emerald-400 flex items-center gap-1"><i data-lucide="layout-grid" class="w-3 h-3"></i> 한국 시장 수급 (KRX)</span>
      </div>
      <iframe id="krxHeatmap" src="https://s.tradingview.com/embed-widget/stock-heatmap/?locale=kr&dataSource=KRX&colorTheme=dark&hasSymbolLogo=true&grouping=sector&market=all&symbolBy=market_cap&size=market_cap&color=change"></iframe>
    </div>

    <div class="h-[400px] widget-container">
      <iframe src="https://s.tradingview.com/embed-widget/technical-analysis/?locale=kr&colorTheme=dark&symbol=NASDAQ%3AIXIC&interval=1h&isTransparent=true"></iframe>
    </div>

    <div class="h-[450px] widget-container">
      <div class="p-3 border-b border-slate-800 bg-[#0d0d0d] flex items-center gap-2">
        <i data-lucide="newspaper" class="w-4 h-4 text-amber-400"></i>
        <span class="text-xs font-bold text-white uppercase">Real-time Intelligence</span>
      </div>
      <iframe id="newsWidget" src="https://s.tradingview.com/embed-widget/timeline/?locale=kr&colorTheme=dark&isTransparent=true&displayMode=regular"></iframe>
    </div>

    <div class="grid grid-cols-2 gap-3 pb-10">
      <a href="https://finance.naver.com/sise/" target="_blank" class="p-4 bg-slate-900 border border-slate-800 rounded-xl flex flex-col items-center gap-2">
        <i data-lucide="bar-chart-3" class="text-emerald-400"></i>
        <span class="text-[10px] font-bold">네이버 수급</span>
      </a>
      <a href="https://whalewisdom.com/" target="_blank" class="p-4 bg-slate-900 border border-slate-800 rounded-xl flex flex-col items-center gap-2">
        <i data-lucide="target" class="text-indigo-400"></i>
        <span class="text-[10px] font-bold">기관 매집</span>
      </a>
    </div>
  </div>

  <script>
    lucide.createIcons();
    const btn = document.getElementById('refreshBtn');
    const icon = document.getElementById('refreshIcon');
    btn.addEventListener('click', () => {
      icon.classList.add('animate-spin');
      document.querySelectorAll('iframe').forEach(f => f.src = f.src);
      setTimeout(() => icon.classList.remove('animate-spin'), 1000);
    });
  </script>
</body>
</html>
